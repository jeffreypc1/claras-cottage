<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Clara's Cottage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" style="background: rgba(101, 67, 33, 0.9);">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="menu.html" class="nav-link">Menu</a>
            <a href="contact.html" class="nav-link active">Contact</a>
        </nav>
    </header>

    <main class="contact-page">
        <div class="contact-container">
            <div class="contact-header">
                <h1>Get in Touch</h1>
                <p>Have a special order in mind? Questions about our baked goods?<br>We'd love to hear from you!</p>
            </div>
            
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="What should we call you?" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone (optional)</label>
                    <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567">
                </div>
                
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" placeholder="Tell us about your order or question..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message 💌</button>
            </form>
            
            <div style="text-align: center; margin-top: 2rem; color: var(--brown-medium);">
                <p style="font-family: var(--font-script); font-size: 1.5rem;">Or find us on social media</p>
                <div style="font-size: 2rem; margin-top: 1rem;">
                    <span style="margin: 0 0.5rem; cursor: pointer;" title="Instagram - Coming Soon">📷</span>
                    <span style="margin: 0 0.5rem; cursor: pointer;" title="Facebook - Coming Soon">📘</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p class="cottage-food-notice">
                🏠 Made with love in a California home kitchen
            </p>
            <p class="copyright">© 2026 Clara's Cottage</p>
        </div>
    </footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message! We\'ll get back to you soon. 🍪');
            this.reset();
        });
    </script>
</body>
</html>
