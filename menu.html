<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Clara's Cottage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pacifico&family=Shadows+Into+Light&family=Amatic+SC:wght@400;700&family=Indie+Flower&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header" style="background: rgba(101, 67, 33, 0.9);">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="menu.html" class="nav-link active">Baked Goods</a>
            <a href="flowers.html" class="nav-link">Flowers</a>
            <a href="contact.html" class="nav-link">Contact</a>
            <a href="order.html" class="nav-link">🛒 <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="menu-page">
        <div class="chalkboard-container">
            <div class="chalkboard">
                <h1 class="chalkboard-title">Clara's Cottage</h1>
                <p class="chalkboard-subtitle">~ Today's Offerings ~</p>
                
                <div class="chalk-decoration">✿ ✿ ✿</div>
                
                <div id="menu-display">
                    <!-- Menu items will be loaded from localStorage -->
                </div>
                
                <div class="chalk-decoration">~ Baked Fresh Daily ~</div>
                
                <p style="text-align: center; color: #f5f5dc; font-family: var(--font-script); font-size: 1.2rem; margin-top: 2rem;">
                    🏠 Made with love in our California home kitchen
                </p>
            </div>
        </div>
        
        <!-- Sandwich Board Legs (decorative) -->
        <div style="text-align: center; margin-top: -10px;">
            <svg width="200" height="60" viewBox="0 0 200 60">
                <line x1="50" y1="0" x2="30" y2="60" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
                <line x1="150" y1="0" x2="170" y2="60" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
            </svg>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p class="cottage-food-notice">
                🏠 Made with love in a California home kitchen
            </p>
            <p class="copyright">© 2026 Clara's Cottage</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        // Load and display menu from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            displayMenu();
        });
    </script>
</body>
</html>
