<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Order | Clara's Cottage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pacifico&family=Shadows+Into+Light&family=Amatic+SC:wght@400;700&family=Indie+Flower&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .order-page {
            min-height: 100vh;
            padding: 6rem 2rem 2rem;
            background: var(--cream);
        }
        .order-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .order-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .order-header h1 {
            font-family: var(--font-script);
            font-size: 3rem;
            color: var(--brown-dark);
        }
        .cart-empty {
            text-align: center;
            padding: 3rem;
            background: var(--warm-white);
            border-radius: 15px;
            border: 2px dashed var(--parchment);
        }
        .cart-empty p {
            font-size: 1.2rem;
            color: var(--brown-medium);
            margin-bottom: 1rem;
        }
        .cart-items {
            background: var(--warm-white);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--parchment);
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .item-info {
            flex: 1;
        }
        .item-name {
            font-family: var(--font-script);
            font-size: 1.4rem;
            color: var(--brown-dark);
        }
        .item-price {
            color: var(--brown-medium);
            font-size: 0.9rem;
        }
        .item-qty {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .qty-btn {
            width: 32px;
            height: 32px;
            border: 2px solid var(--parchment);
            background: var(--cream);
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .qty-btn:hover {
            background: var(--gold-light);
            border-color: var(--gold);
        }
        .qty-num {
            width: 40px;
            text-align: center;
            font-family: var(--font-script);
            font-size: 1.3rem;
        }
        .item-total {
            font-family: var(--font-script);
            font-size: 1.3rem;
            color: var(--brown-dark);
            min-width: 80px;
            text-align: right;
        }
        .remove-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            margin-left: 1rem;
        }
        .remove-btn:hover {
            opacity: 1;
        }
        .cart-summary {
            background: var(--parchment);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .summary-row.total {
            font-family: var(--font-script);
            font-size: 1.8rem;
            color: var(--brown-dark);
            border-top: 2px solid var(--brown-light);
            padding-top: 1rem;
            margin-top: 1rem;
        }
        .checkout-form {
            background: var(--warm-white);
            border-radius: 15px;
            padding: 2rem;
        }
        .checkout-form h2 {
            font-family: var(--font-script);
            font-size: 2rem;
            color: var(--brown-dark);
            margin-bottom: 1.5rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .cart-item { flex-wrap: wrap; gap: 1rem; }
        }
    </style>
</head>
<body>
    <header class="site-header" style="background: rgba(101, 67, 33, 0.9);">
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="menu.html" class="nav-link">Baked Goods</a>
            <a href="flowers.html" class="nav-link">Flowers</a>
            <a href="contact.html" class="nav-link">Contact</a>
            <a href="order.html" class="nav-link active">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="order-page">
        <div class="order-container">
            <div class="order-header">
                <h1>🛒 Your Order</h1>
            </div>

            <div id="cart-empty" class="cart-empty" style="display: none;">
                <p>Your cart is empty</p>
                <a href="menu.html" class="cta-button">Browse Baked Goods</a>
                <a href="flowers.html" class="cta-button secondary">Browse Flowers</a>
            </div>

            <div id="cart-content" style="display: none;">
                <div class="cart-items" id="cart-items">
                    <!-- Cart items will be inserted here -->
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>

                <div class="checkout-form">
                    <h2>📋 Order Details</h2>
                    <form id="order-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="name">Your Name</label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="pickup-date">Preferred Pickup Date</label>
                            <input type="date" id="pickup-date" name="pickup-date" required>
                        </div>
                        <div class="form-group">
                            <label for="notes">Special Requests</label>
                            <textarea id="notes" name="notes" placeholder="Any special instructions..."></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Place Order 🍪</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p class="cottage-food-notice">🏠 Made with love in a California home kitchen</p>
            <p class="copyright">© 2026 Clara's Cottage</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderCart();
            
            // Set min date for pickup to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('pickup-date').min = tomorrow.toISOString().split('T')[0];
        });

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const cart = getCart();
            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                pickupDate: document.getElementById('pickup-date').value,
                notes: document.getElementById('notes').value,
                items: cart,
                total: calculateTotal(cart)
            };
            
            // For now, show confirmation and store order
            const orders = JSON.parse(localStorage.getItem('claras-orders') || '[]');
            formData.id = Date.now();
            formData.status = 'pending';
            formData.createdAt = new Date().toISOString();
            orders.push(formData);
            localStorage.setItem('claras-orders', JSON.stringify(orders));
            
            // Clear cart
            localStorage.removeItem('claras-cart');
            
            alert('Thank you for your order! 🍪\\n\\nWe\\'ll contact you to confirm pickup details.\\n\\nOrder #' + formData.id);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
